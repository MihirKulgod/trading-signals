name: Build Windows executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $nicegui = python -c "import nicegui, os; print(os.path.dirname(nicegui.__file__))"
          pyinstaller --name "Trading Signals" --onedir `
            --add-data "${nicegui};nicegui" `
            --copy-metadata pandas-ta-openbb `
            --copy-metadata keyring `
            main.py

      - name: Trust the .NET assemblies pythonnet loads
        # A zip downloaded from a release carries Windows' "Mark of the Web",
        # which the legacy .NET Framework CLR (pythonnet's netfx backend)
        # refuses to load from by default -- this is what crashes the native
        # window on launch. loadFromRemoteSources tells it to trust MOTW-
        # flagged assemblies so the app runs straight out of the zip.
        shell: pwsh
        run: |
          Copy-Item "packaging\windows\Trading Signals.exe.config" "dist\Trading Signals\Trading Signals.exe.config"

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path "dist/Trading Signals/*" -DestinationPath "Trading-Signals-windows.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Trading-Signals-windows.zip
          prerelease: true
